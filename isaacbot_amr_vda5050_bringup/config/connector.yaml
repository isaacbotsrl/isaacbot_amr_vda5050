# VDA 5050 connector for Ardennes: InOrbit's mqtt_bridge + controller (third_party/) and the
# connector's adapter node loading isaacbot_amr_vda5050_adapter's plugins.
#
# vda5050.launch.py overrides the identity and broker parameters from its arguments (and those
# from the ISAACBOT_AMR_VDA5050_* container variables); the values here are the defaults for a manual
# `ros2 launch` without arguments. The node keys match any namespace.

/**/mqtt_bridge:
  ros__parameters:
    mqtt_address: "localhost"
    mqtt_port: 1883
    # Empty username: no TLS and no authentication (the isaacbot's own broker, LAN only).
    mqtt_username: ""
    mqtt_password: ""
    manufacturer_name: "IsaacBot"
    serial_number: "ardennes"
    # Topics are <interface_name>/v2/<manufacturer_name>/<serial_number>/<topic>.
    interface_name: "uagv"
    vda5050_protocol_version: "2.0.0"

/**/controller:
  ros__parameters:
    # robot_name names the controller <-> adapter ROS interfaces; keep it equal to the adapter's.
    robot_name: "ardennes"
    manufacturer_name: "IsaacBot"
    serial_number: "ardennes"
    protocol_version: "2.0.0"
    interface_name: "uagv"

    # Send each released base segment as one NavigateThroughNodes goal, extended in flight when
    # master control stitches the order. The adapter implements no NavigateToNode handler.
    enable_nav_through_nodes: true

    # The adapter queries the isaacbot on every publish. VDA 5050 asks for state at least every
    # 30 s and on every event; the controller also publishes on events.
    state_pub_period: 1.0
    visualization_pub_period: 0.5
    connection_pub_period: 15.0

    factsheet:
      type_specification:
        series_name: "Ardennes"
        series_description: "Outdoor skid-steer isaacbot (IsaacBot)"
        # Skid steer turns like a differential drive; VDA 5050 2.0 has no closer kinematic type.
        agv_kinematic: "DIFF"
        agv_class: "CARRIER"
        max_load_mass: 0.0          # TBD: no payload rating recorded
        localization_types: ["NATURAL"]
        navigation_types: ["AUTONOMOUS"]
      physical_parameters:
        # isaacbot_amr_navigation/config/isaacbot_amr_nav_params.yaml, velocity_smoother: max_velocity[0] and
        # max_accel[0] / max_decel[0].
        speed_min: 0.0
        speed_max: 0.8
        acceleration_max: 1.4
        deceleration_max: 1.4
        # isaacbot_amr_nav_params.yaml, footprint comment: 0.913 x 0.803 m (measured 2026-09-27).
        length: 0.913
        width: 0.803
        height_min: 0.0             # TBD: not recorded
        height_max: 0.0             # TBD: not recorded

/**/adapter:
  ros__parameters:
    robot_name: "ardennes"
    manufacturer_name: "IsaacBot"
    serial_number: "ardennes"

    state_handler_names: ["isaacbot_amr_vda5050_adapter::plugins::IsaacbotStateHandler"]

    nav_through_nodes:
      handler: "isaacbot_amr_vda5050_adapter::plugins::MissionNavThroughNodes"

    # cancelOrder, stateRequest and factsheetRequest are handled by the controller itself.
    vda_action_handlers:
      ["startPause", "stopPause", "enableAuxOutput", "disableAuxOutput", "setDriveMode",
       "startFollowing", "stopFollowing"]
    start_pause:
      handler: "isaacbot_amr_vda5050_adapter::plugins::StartPause"
      description: "Stop driving and keep the order; stopPause continues it."
      result_description: "Paused."
      scopes:
        instant: true
        node: false
        edge: false
    stop_pause:
      handler: "isaacbot_amr_vda5050_adapter::plugins::StopPause"
      description: "Continue the order from the first node not yet reached."
      result_description: "Resumed."
      scopes:
        instant: true
        node: false
        edge: false

    # Aux outputs 1..6 = safety PLC DIO00..05 (hardware_interface/aux_output_0..5/set); not part
    # of the safety chain. One action switches every output its list names: the connector
    # rejects a second action of the same type while the first is still running.
    enable_aux_output:
      handler: "isaacbot_amr_vda5050_adapter::plugins::EnableAuxOutput"
      description: "Switch aux outputs on (safety PLC DIO00..05)."
      result_description: "The outputs switched, or why not."
      scopes:
        instant: true
        node: true
        edge: false
      parameters: ["outputs"]
      parameter_outputs:
        data_type: "ARRAY"
        description: "Output number 1..6 (1 = DIO00), or a list of them, e.g. [1, 3]."
        is_optional: false
    disable_aux_output:
      handler: "isaacbot_amr_vda5050_adapter::plugins::DisableAuxOutput"
      description: "Switch aux outputs off (safety PLC DIO00..05)."
      result_description: "The outputs switched, or why not."
      scopes:
        instant: true
        node: true
        edge: false
      parameters: ["outputs"]
      parameter_outputs:
        data_type: "ARRAY"
        description: "Output number 1..6 (1 = DIO00), or a list of them, e.g. [1, 3]."
        is_optional: false

    # Custom: VDA 5050 has no master-control command for operatingMode. Calls isaacbot_amr_drive_mode's
    # set_drive_mode; the new mode shows in the state's operatingMode. Served in every operating
    # mode (MANUAL included), so fleet control can hand a Manual isaacbot back to Automatic.
    set_drive_mode:
      handler: "isaacbot_amr_vda5050_adapter::plugins::SetDriveMode"
      description: "Switch the isaacbot to Manual (stop automation) or Automatic (fleet control drives)."
      result_description: "The drive mode in force, or why the drive mode manager refused."
      scopes:
        instant: true
        node: false
        edge: false
      parameters: ["mode"]
      parameter_mode:
        data_type: "STRING"
        description: "MANUAL or AUTOMATIC. Assisted is chosen on the isaacbot's drive UI only."
        is_optional: false

    # Custom: follow-me (isaacbot_amr_follow_me's follow_me/start and follow_me/stop). Fleet control
    # decides that the isaacbot follows; the isaacbot follows on its own (Nav 2's Following server), so
    # the action finishes once following has started or stopped. follow_me refuses a start outside
    # Automatic, during an order or with nobody in front of the isaacbot; an order sent while it
    # follows stops following.
    start_following:
      handler: "isaacbot_amr_vda5050_adapter::plugins::StartFollowing"
      description: "Follow the person standing about 1.5 m in front of the isaacbot (follow-me)."
      result_description: "Following started, or why follow-me refused."
      scopes:
        instant: true
        node: false
        edge: false
    stop_following:
      handler: "isaacbot_amr_vda5050_adapter::plugins::StopFollowing"
      description: "Stop following (follow-me)."
      result_description: "Following stopped, or why not."
      scopes:
        instant: true
        node: false
        edge: false

    # isaacbot_amr_vda5050_adapter: how the orders reach the isaacbot. Relative names resolve against
    # isaacbot.namespace (not the connector's own <namespace>/vda5050); frames get the isaacbot's
    # <namespace>/ tf prefix unless they already name one.
    isaacbot:
      namespace: "isaacbot"
      # Nav 2's global frame. Order node positions are taken to be in this frame, and
      # isaacbot_amr_mission_manager refuses missions in any other.
      map_frame: "map"
      base_frame: "base_link"
      # Reported as mapId when isaacbot_amr_indoor_nav_manager does not name the map in use.
      map_id: ""
      mission_prefix: "vda5050"
      # "path": arrive at each node facing along the edge driven in on (skid steer turns in
      # place poorly, and the ROS message cannot tell an omitted theta from 0). "node": use each
      # node's theta.
      orientation_mode: "path"
      set_mission_service: "set_mission"
      run_mission_service: "run_mission"
      mission_state_topic: "mission_state"
      drive_mode_topic: "drive_mode"
      # setDriveMode calls it (isaacbot_amr_msgs/SetDriveMode); service_*_timeout apply.
      drive_mode_service: "set_drive_mode"
      # startFollowing / stopFollowing call these (std_srvs/Trigger, isaacbot_amr_follow_me).
      follow_me_start_service: "follow_me/start"
      follow_me_stop_service: "follow_me/stop"
      battery_topic: "battery/battery_status"
      safety_status_topic: "hardware_interface/safety_status"
      motion_lock_topic: "motion_lock"
      localization_state_topic: "localization_state"
      odom_topic: "odom"
      # enableAuxOutput / disableAuxOutput call <prefix><0..5>/set (std_srvs/SetBool).
      aux_output_service_prefix: "hardware_interface/aux_output_"
      service_availability_timeout: 2.0
      service_response_timeout: 3.0
      # Older poses (map -> base TF) and status messages count as unknown.
      pose_timeout: 2.0
      status_timeout: 2.0
      # Per output write; the service answers once the safety PLC has acknowledged it.
      aux_output_timeout: 3.0
